# PitVoice language pack: Russian.
# Format 2: words by class, the rules are the same for every language. See docs/adding-a-language.md.
# Validate with `pitvoice-cli validate`.
language: ru
name: Русский
version: 2
asr_model: vosk-model-small-ru-0.22
plural_rules: ru

units:
  liters:
    synonyms: [литр, литра, литров, литры, л]
    forms: { one: литр, few: литра, many: литров }
    short: л
  gallons:
    synonyms: [галлон, галлона, галлонов]
    forms: { one: галлон, few: галлона, many: галлонов }
    short: гал

conjunctions: [и, а также, плюс, потом, затем, ещё]
fillers: [пожалуйста, давай, так, ну, слушай, эй, короче, значит, надо]
negations: [не, без]
# Words that reject the whole phrase: the driver asks for something PitVoice cannot do (a fraction with "точка") or
# talks to someone else ("кто впереди меня"). Without them the recognizer drops the tail it cannot write.
# The model knows only "слик": "на слики" is heard as "на слик" or "на слик и", and the dangling conjunction is
# dropped. If a word is lost anyway, "на" without a compound rejects the phrase. After "меняем резину" the recognizer
# may drop a quiet "на слики" whole; that tail is then recognized on its own and gives "слик" (FR-ASR-8).
reject_words: [точка, запятая, кто, впереди, сзади, позади, меня]
# The recognizer swaps these forms freely ("меняй переднее" for "меняй передние"): a form said alone is its word.
# A wheel matches only as written ("переднее левое"), and a side and an axle in a row are rejected: say
# "меняй левые и передние" for both, "меняй переднее левое" for the wheel.
word_forms:
  передние: [переднее]
  задние: [заднее]
  левые: [левое, левая]
  правые: [правое, правая]
  сухие: [сухую]
  дождевые: [дождевую, дождевая]
  мокрые: [мокрую]

lexicon:
  fuel:
    action: [залей, заливай, добавь, заправить, долей, налей, залить, долить, налить, добавить, наливай, добавляй, заливаем,
      добавим, заправку, дозаправку]
    object: [топливо, топлива]
  tires:
    # "новые" and "свежие" act like a verb: "свежую резину", "новые передние".
    action: [меняй, меняем, поменяй, поменяем, поменять, смени, сменим, замени, заменим, заменяем, заменить, замена, замену,
      смена, смену, менять, сменить, новые, новую, свежие, свежую]
    object: [шины, шин, резину, резины, колесо]
    keep: [трогай]
    targets:
      all: [все, все четыре]
      left: [левые, левая сторона, левую сторону]
      right: [правые, правая сторона, правую сторону]
      front: [передние]
      rear: [задние]
      lf: [переднее левое, левое переднее]
      rf: [переднее правое, правое переднее]
      lr: [заднее левое, левое заднее]
      rr: [заднее правое, правое заднее]
    # A compound changes all four tires; "на" leads to it: "меняем резину на дождевые".
    compounds:
      dry: [сухие, слик]
      wet: [дождевые, мокрые]
    into: [на]
  windshield:
    action: [сорви, сними, снимай, протри, почисти, смени, сорвать, снять, протереть, почистить, оторви, протираем, снимаем]
    object: [стекло, плёнку]
    keep: [трогай]
  repair:
    action: [почини, чини, починить, починим, ремонтировать, отремонтировать, ремонтируем]
    object: [машину, ремонт, ремонта, починка, починки]
    fast: [быстрый, быстрая]
  clear:
    # "сними", "снимай", "снимаем", "снять" are windshield verbs too: the object picks the group ("снимай всё",
    # "снимай плёнку"), and "снимай все шины" fits two commands and is rejected.
    action: [сбрось, очисти, отмени, убери, отменить, очистить, сбросить, убрать, удали, удалить, отмена, сбросим, сбрасываем,
      отменим, отменяем, очищаем, удаляй, удаляем, убирай, убираем, сотри, стереть, сними, снимай, снимаем, снять]
    object: [всё, все команды]

responses:
  fuel.add: "заливаем {amount} {unit}"
  fuel.none: "без топлива"
  tires.all: "меняем все шины"
  tires.left: "меняем левые"
  tires.right: "меняем правые"
  tires.front: "меняем передние"
  tires.rear: "меняем задние"
  tires.lf: "меняем переднее левое"
  tires.rf: "меняем переднее правое"
  tires.lr: "меняем заднее левое"
  tires.rr: "меняем заднее правое"
  tires.dry: "ставим сухие"
  tires.wet: "ставим дождевые"
  tires.none: "шины не меняем"
  tires.none.left: "левые не меняем"
  tires.none.right: "правые не меняем"
  tires.none.front: "передние не меняем"
  tires.none.rear: "задние не меняем"
  tires.none.lf: "переднее левое не меняем"
  tires.none.rf: "переднее правое не меняем"
  tires.none.lr: "заднее левое не меняем"
  tires.none.rr: "заднее правое не меняем"
  windshield.tearoff: "протираем стекло"
  windshield.none: "стекло не трогаем"
  repair.fast: "быстрый ремонт"
  repair.none: "без ремонта"
  pit.clear: "сбросил всё"
  not_understood: "не понял, повтори"
  not_connected: "нет связи с игрой"
  not_in_car: "ты не в машине"
  apply_failed: "команда не применилась"
  no_dry_tires: "у машины нет сухих шин"
  no_wet_tires: "у машины нет дождевых шин"
  several_dry_tires: "у машины несколько сухих составов"

# The result chip of an applied phrase in the window: short responses of its commands joined by " · ".
short_responses:
  fuel.add: "+{amount} {unit}"
  fuel.none: "без топлива"
  tires.all: "все шины"
  tires.left: "левые"
  tires.right: "правые"
  tires.front: "передние"
  tires.rear: "задние"
  tires.lf: "переднее левое"
  tires.rf: "переднее правое"
  tires.lr: "заднее левое"
  tires.rr: "заднее правое"
  tires.dry: "сухие"
  tires.wet: "дождевые"
  tires.none: "без шин"
  tires.none.left: "без левых"
  tires.none.right: "без правых"
  tires.none.front: "без передних"
  tires.none.rear: "без задних"
  tires.none.lf: "без переднего левого"
  tires.none.rf: "без переднего правого"
  tires.none.lr: "без заднего левого"
  tires.none.rr: "без заднего правого"
  windshield.tearoff: "стекло"
  windshield.none: "без стекла"
  repair.fast: "ремонт"
  repair.none: "без ремонта"
  pit.clear: "сброс"

tests:
  # fuel.add: every verb
  - say: "залей тридцать пять литров"
    expect: [{ intent: fuel.add, amount: 35, unit: liters }]
  - say: "залей двадцать"
    expect: [{ intent: fuel.add, amount: 20 }]          # unit comes from settings
  - say: "заливай сорок"
    expect: [{ intent: fuel.add, amount: 40 }]
  - say: "добавь двадцать литров топлива"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "заправить сто двадцать пять литров"
    expect: [{ intent: fuel.add, amount: 125, unit: liters }]
  - say: "долей двадцать литров"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "налей пятьдесят литров"
    expect: [{ intent: fuel.add, amount: 50, unit: liters }]
  - say: "залей сорок галлонов"
    expect: [{ intent: fuel.add, amount: 40, unit: gallons }]
  - say: "тридцать литров топлива"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "двадцать литров залей"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "залей двадцать одна литр"
    expect: [{ intent: fuel.add, amount: 21, unit: liters }]
  - say: "залей 40 литров"
    expect: [{ intent: fuel.add, amount: 40, unit: liters }]
  # infinitives, we-forms and nouns of the action
  - say: "залить двадцать литров"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "долить десять"
    expect: [{ intent: fuel.add, amount: 10 }]
  - say: "налить тридцать литров"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "добавить двадцать литров топлива"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "наливай сорок"
    expect: [{ intent: fuel.add, amount: 40 }]
  - say: "добавляй двадцать"
    expect: [{ intent: fuel.add, amount: 20 }]
  - say: "заливаем тридцать литров"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "добавим десять литров"
    expect: [{ intent: fuel.add, amount: 10, unit: liters }]
  - say: "заправку двадцать литров"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "дозаправку тридцать литров"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "залить"
    expect: reject

  # fuel.none
  - say: "без топлива"
    expect: [{ intent: fuel.none }]
  - say: "топливо не надо"
    expect: [{ intent: fuel.none }]
  - say: "не заливай"
    expect: [{ intent: fuel.none }]
  - say: "не заливаем"
    expect: [{ intent: fuel.none }]

  # tires.all
  - say: "меняй шины"
    expect: [{ intent: tires.all }]
  - say: "шины меняй"
    expect: [{ intent: tires.all }]
  - say: "поменяй резину"
    expect: [{ intent: tires.all }]
  - say: "меняй все четыре"
    expect: [{ intent: tires.all }]
  - say: "заменяем все шины"
    expect: [{ intent: tires.all }]
  - say: "замени колесо"
    expect: [{ intent: tires.all }]
  # nouns of the action, "новые" and "свежие"
  - say: "замена шин"
    expect: [{ intent: tires.all }]
  - say: "смена резины"
    expect: [{ intent: tires.all }]
  - say: "менять шины"
    expect: [{ intent: tires.all }]
  - say: "свежую резину"
    expect: [{ intent: tires.all }]
  - say: "новые шины"
    expect: [{ intent: tires.all }]
  - say: "сменить передние"
    expect: [{ intent: tires.front }]
  - say: "свежие передние"
    expect: [{ intent: tires.front }]
  - say: "замена"
    expect: reject
  - say: "свежие"
    expect: reject
  - say: "новые"
    expect: reject
  - say: "меняй на свежие"
    expect: reject                                       # "свежие" is no compound, and "на" needs one
  - say: "не меняй новые"
    expect: reject

  # sides and axles, with and without a verb, in any order
  - say: "меняй левые"
    expect: [{ intent: tires.left }]
  - say: "левые меняй"
    expect: [{ intent: tires.left }]
  - say: "поменяем левую сторону"
    expect: [{ intent: tires.left }]
  - say: "меняй правые шины"
    expect: [{ intent: tires.right }]
  - say: "поменяй правые шины"
    expect: [{ intent: tires.right }]
  - say: "правая сторона"
    expect: [{ intent: tires.right }]
  - say: "смени передние"
    expect: [{ intent: tires.front }]
  - say: "заменяем передние"
    expect: [{ intent: tires.front }]
  - say: "задние шины"
    expect: [{ intent: tires.rear }]
  - say: "поменять задние"
    expect: [{ intent: tires.rear }]

  # single wheels: both orders of the name, with and without a verb
  - say: "меняй переднее левое"
    expect: [{ intent: tires.lf }]
  - say: "замени левое переднее"
    expect: [{ intent: tires.lf }]
  - say: "переднее левое"
    expect: [{ intent: tires.lf }]
  - say: "сменим переднее правое"
    expect: [{ intent: tires.rf }]
  - say: "правое переднее меняем"
    expect: [{ intent: tires.rf }]
  - say: "заменим заднее левое"
    expect: [{ intent: tires.lr }]
  - say: "левое заднее"
    expect: [{ intent: tires.lr }]
  - say: "заменяем заднее правое"
    expect: [{ intent: tires.rr }]
  - say: "заменить правое заднее колесо"
    expect: [{ intent: tires.rr }]

  # several targets per action
  - say: "меняй переднее правое и задние"
    expect: [{ intent: tires.rf }, { intent: tires.rear }]
  - say: "меняй левые и передние шины"
    expect: [{ intent: tires.left }, { intent: tires.front }]
  - say: "меняй левые передние"
    expect: reject                                       # a side and an axle in a row: say «и» or name the wheel
  - say: "меняй переднее левое заднее правое"
    expect: [{ intent: tires.lf }, { intent: tires.rr }]

  # removal
  - say: "не меняй шины"
    expect: [{ intent: tires.none }]
  - say: "шины не меняем"
    expect: [{ intent: tires.none }]
  - say: "без шин"
    expect: [{ intent: tires.none }]
  - say: "шины не трогай"
    expect: [{ intent: tires.none }]
  - say: "не меняй левые"
    expect: [{ intent: tires.none.left }]
  - say: "правые не меняй"
    expect: [{ intent: tires.none.right }]
  - say: "без правой стороны"
    expect: reject
  - say: "шины не"
    expect: reject                                       # a negation needs words after it: «шины не меняем»
  - say: "не меняй правую сторону"
    expect: [{ intent: tires.none.right }]
  - say: "не трогай передние"
    expect: [{ intent: tires.none.front }]
  - say: "задние не заменяем"
    expect: [{ intent: tires.none.rear }]
  - say: "не меняй переднее левое"
    expect: [{ intent: tires.none.lf }]
  - say: "не меняй правое переднее"
    expect: [{ intent: tires.none.rf }]
  - say: "заднее левое не меняй"
    expect: [{ intent: tires.none.lr }]
  - say: "не трогай заднее правое"
    expect: [{ intent: tires.none.rr }]
  - say: "передние не меняем"
    expect: [{ intent: tires.none.front }]
  - say: "левое переднее не трогай"
    expect: [{ intent: tires.none.lf }]
  - say: "не заменяем левое заднее"
    expect: [{ intent: tires.none.lr }]
  - say: "правое заднее не меняем"
    expect: [{ intent: tires.none.rr }]
  - say: "не меняй задние левые"
    expect: reject
  - say: "не меняй переднее левое заднее правое"
    expect: [{ intent: tires.none.lf }, { intent: tires.none.rr }]

  # action said once after a conjunction
  - say: "меняй левые и передние"
    expect: [{ intent: tires.left }, { intent: tires.front }]
  - say: "не меняй левые и переднее правое"
    expect: [{ intent: tires.none.left }, { intent: tires.none.rf }]
  - say: "меняй переднее левое и заднее правое и заднее левое"
    expect: [{ intent: tires.lf }, { intent: tires.rr }, { intent: tires.lr }]
  - say: "меняй правые и левые не меняем"
    expect: [{ intent: tires.right }, { intent: tires.none.left }]
  - say: "залей двадцать и передние"
    expect: reject
  - say: "меняй левые и стекло"
    expect: reject

  # windshield: every verb
  - say: "сорви плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "сними плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "снимай плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "протри стекло"
    expect: [{ intent: windshield.tearoff }]
  - say: "почисти стекло"
    expect: [{ intent: windshield.tearoff }]
  - say: "смени плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "стекло не трогай"
    expect: [{ intent: windshield.none }]
  - say: "не снимай плёнку"
    expect: [{ intent: windshield.none }]
  - say: "сорвать плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "снять плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "протереть стекло"
    expect: [{ intent: windshield.tearoff }]
  - say: "почистить стекло"
    expect: [{ intent: windshield.tearoff }]
  - say: "оторви плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "протираем стекло"
    expect: [{ intent: windshield.tearoff }]
  - say: "снимаем плёнку"
    expect: [{ intent: windshield.tearoff }]
  - say: "не снимаем плёнку"
    expect: [{ intent: windshield.none }]

  # repair: every verb
  - say: "быстрый ремонт"
    expect: [{ intent: repair.fast }]
  - say: "быстрая починка"
    expect: [{ intent: repair.fast }]
  - say: "почини машину"
    expect: [{ intent: repair.fast }]
  - say: "чини машину"
    expect: [{ intent: repair.fast }]
  - say: "без ремонта"
    expect: [{ intent: repair.none }]
  - say: "не чини"
    expect: [{ intent: repair.none }]
  - say: "без починки"
    expect: [{ intent: repair.none }]
  - say: "починить машину"
    expect: [{ intent: repair.fast }]
  - say: "починим машину"
    expect: [{ intent: repair.fast }]
  - say: "ремонтировать машину"
    expect: [{ intent: repair.fast }]
  - say: "отремонтировать машину"
    expect: [{ intent: repair.fast }]
  - say: "ремонтируем машину"
    expect: [{ intent: repair.fast }]
  - say: "не ремонтируем"
    expect: [{ intent: repair.none }]

  # pit.clear: every verb
  - say: "сбрось всё"
    expect: [{ intent: pit.clear }]
  - say: "очисти всё"
    expect: [{ intent: pit.clear }]
  - say: "отмени все команды"
    expect: [{ intent: pit.clear }]
  - say: "убери всё"
    expect: [{ intent: pit.clear }]
  - say: "отменить всё"
    expect: [{ intent: pit.clear }]
  - say: "очистить всё"
    expect: [{ intent: pit.clear }]
  - say: "сбросить все команды"
    expect: [{ intent: pit.clear }]
  - say: "убрать всё"
    expect: [{ intent: pit.clear }]
  - say: "удали всё"
    expect: [{ intent: pit.clear }]
  - say: "удалить все команды"
    expect: [{ intent: pit.clear }]
  - say: "отмена всё"
    expect: [{ intent: pit.clear }]
  - say: "сбросим всё"
    expect: [{ intent: pit.clear }]
  - say: "сбрасываем всё"
    expect: [{ intent: pit.clear }]
  - say: "отменим всё"
    expect: [{ intent: pit.clear }]
  - say: "отменяем все команды"
    expect: [{ intent: pit.clear }]
  - say: "очищаем всё"
    expect: [{ intent: pit.clear }]
  - say: "удаляй все"
    expect: [{ intent: pit.clear }]
  - say: "удаляем всё"
    expect: [{ intent: pit.clear }]
  - say: "убирай всё"
    expect: [{ intent: pit.clear }]
  - say: "убираем все"
    expect: [{ intent: pit.clear }]
  - say: "сотри все"
    expect: [{ intent: pit.clear }]
  - say: "стереть все команды"
    expect: [{ intent: pit.clear }]
  # verbs shared with the windshield: the object picks the group
  - say: "сними всё"
    expect: [{ intent: pit.clear }]
  - say: "снимай все"
    expect: [{ intent: pit.clear }]
  - say: "снимаем всё"
    expect: [{ intent: pit.clear }]
  - say: "снять все команды"
    expect: [{ intent: pit.clear }]
  - say: "отменить"
    expect: reject                                       # a clear verb needs its object
  - say: "удали"
    expect: reject
  - say: "сними"
    expect: reject
  - say: "снимаем"
    expect: reject
  - say: "удали шины"
    expect: reject
  - say: "отмени шины"
    expect: reject
  - say: "снимай все шины"
    expect: reject                                       # fits both "снимай всё" and "все шины"
  - say: "снять все шины"
    expect: reject

  # compound commands, also with the conjunction lost by the recognizer
  - say: "меняй шины и залей двадцать пять литров"
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "меняй шины залей двадцать пять литров"
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "залей десять литров меняй правую сторону и сорви плёнку"
    expect: [{ intent: fuel.add, amount: 10, unit: liters }, { intent: tires.right }, { intent: windshield.tearoff }]
  - say: "меняй правые и не меняй левые"
    expect: [{ intent: tires.right }, { intent: tires.none.left }]
  - say: "залей двадцать и залей тридцать"
    expect: [{ intent: fuel.add, amount: 30 }]
  - say: "меняй все эти шины"
    expect: [{ intent: tires.all }]

  # conflicts
  - say: "меняй шины и не меняй шины"
    expect: reject
  - say: "меняй левые и не меняй переднее левое"
    expect: reject
  - say: "сбрось всё и залей двадцать"
    expect: reject
  - say: "отмени всё, залей десять литров и меняй правую сторону"
    expect: reject
  - say: "сбрось все шины"
    expect: reject
  - say: "снимай плёнку и снимай всё"
    expect: reject

  # fractions are never rounded
  - say: "залей тридцать точка два"
    expect: reject
  - say: "залей 30.2 литра"
    expect: reject
  - say: "залей тридцать и два литра"
    expect: reject

  # removed noise words and single words
  - say: "тир офф"
    expect: reject
  - say: "сколько горючего"
    expect: reject
  - say: "отмена"
    expect: reject
  - say: "ничего не делай"
    expect: reject
  - say: "передние"
    expect: reject
  - say: "почини"
    expect: reject
  - say: "плесни тридцать литров"
    expect: reject
  - say: "топливо шины"
    expect: reject
  - say: "меняй правую"
    expect: reject

  # unrelated speech
  - say: "какая сегодня погода"
    expect: reject
  - say: "кто впереди меня"
    expect: reject
  - say: "левее"
    expect: reject
  - say: "отмени"
    expect: reject
  - say: "меняй шины и спой песню"
    expect: reject
  - say: "залей тысячу литров"
    expect: reject

  # tire compounds: with an action, the object, "на" or "все"; all four tires
  - say: "меняем резину на дождевые"
    expect: [{ intent: tires.wet }]
  - say: "дождевые шины"
    expect: [{ intent: tires.wet }]
  - say: "на дождевые"
    expect: [{ intent: tires.wet }]
  - say: "меняй все на мокрые"
    expect: [{ intent: tires.wet }]
  - say: "меняем резину на дождевую"
    expect: [{ intent: tires.wet }]
  - say: "меняй шины на сухие"
    expect: [{ intent: tires.dry }]
  - say: "на сухие"
    expect: [{ intent: tires.dry }]
  - say: "поменяй на сухую резину"
    expect: [{ intent: tires.dry }]
  - say: "меняй на дождевые и залей двадцать литров"
    expect: [{ intent: tires.wet }, { intent: fuel.add, amount: 20, unit: liters }]
  - say: "меняй на дождевые и меняй левые"
    expect: [{ intent: tires.wet }, { intent: tires.left }]
  - say: "меняй левые и на дождевые"
    expect: [{ intent: tires.left }, { intent: tires.wet }]
  - say: "дождевые"
    expect: reject                                       # one word never changes the pit stop
  - say: "меняй левые на дождевые"
    expect: reject                                       # a compound only on all four tires
  - say: "не меняй на дождевые"
    expect: reject
  - say: "меняй на дождевые и на сухие"
    expect: reject
  - say: "меняй резину на дождевые и не меняй левые"
    expect: reject
  # "слик": the only form in the model; "на слики" is heard as "на слик" or "на слик и"
  - say: "на слик"
    expect: [{ intent: tires.dry }]
  - say: "меняем резину на слик"
    expect: [{ intent: tires.dry }]
  - say: "меняем резину на слик и"
    expect: [{ intent: tires.dry }]
  - say: "на слик и залей двадцать литров"
    expect: [{ intent: tires.dry }, { intent: fuel.add, amount: 20, unit: liters }]
  - say: "слик"
    expect: reject
  - say: "меняй левые на слик"
    expect: reject
  - say: "меняй на слик и на дождевые"
    expect: reject
  # tire action nouns and "новые" lead to a compound too
  - say: "замена на сухие"
    expect: [{ intent: tires.dry }]
  - say: "смену на дождевые"
    expect: [{ intent: tires.wet }]
  - say: "новые на сухие"
    expect: [{ intent: tires.dry }]
  # "на" without a compound: the recognizer lost the word after it
  - say: "меняем резину на"
    expect: reject
  - say: "залей двадцать на и меняй шины"
    expect: reject

  # a form alone is its word; a side and an axle in a row are rejected, a wheel is named as written
  - say: "меняй переднее"
    expect: [{ intent: tires.front }]
  - say: "смени переднее правая"
    expect: reject
  - say: "меняй передние левое заднее правое"
    expect: reject

  # the same action twice without a conjunction: "и не" was lost
  - say: "меняй шины меняй шины"
    expect: reject
  - say: "меняй правые меняй левое"
    expect: reject
  - say: "не трогай заднее"
    expect: [{ intent: tires.none.rear }]

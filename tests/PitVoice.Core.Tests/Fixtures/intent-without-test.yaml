language: ru
name: Intent без теста
units:
  liters:
    synonyms: [литр]
    forms: { one: литр, few: литра, many: литров }
intents:
  tires.all:
    patterns: ["меняй шины"]
    response: "меняем шины"
  repair.fast:
    patterns: ["быстрый ремонт"]
    response: "ремонт"
responses:
  not_understood: "не понял"
  not_connected: "no connection"
  not_in_car: "not in car"
  apply_failed: "failed"
  not_supported: "not supported"
tests:
  - say: "меняй шины"
    expect: [{ intent: tires.all }]

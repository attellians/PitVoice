name: Неизвестный слот
language: ru
plural_rules: ru
units:
  liters:
    synonyms: [литр, литра, литров]
    forms: { one: литр, few: литра, many: литров }
    short: л
conjunctions: [и]
fillers: [пожалуйста]
lexicon:
  fuel: { action: [залей] }
  tires: { action: [меняй], object: [шины] }
responses:
  fuel.add: "заливаем {amount} {liters}"
  tires.all: "меняем шины"
  not_understood: "не понял"
  not_connected: "no connection"
  not_in_car: "not in car"
  apply_failed: "failed"
short_responses:
  fuel.add: "+{amount} {unit}"
  tires.all: "все шины"
tests:
  - say: "залей десять литров"
    expect: [{ intent: fuel.add, amount: 10, unit: liters }]
  - say: "меняй шины"
    expect: [{ intent: tires.all }]
  - say: "привет"
    expect: reject

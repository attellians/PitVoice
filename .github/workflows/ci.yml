name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PITVOICE_MODELS_DIR: ${{ github.workspace }}/models-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PitVoice.sln

      - name: Build
        run: dotnet build PitVoice.sln --configuration Release --no-restore

      # The manifest pins every archive by sha256, so its hash is a safe cache key.
      - name: Cache speech models
        id: models
        uses: actions/cache@v6
        with:
          path: models-cache
          key: speech-models-${{ runner.os }}-${{ hashFiles('models/manifest.json') }}

      - name: Download speech models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          dotnet run --project tools/PitVoice.Cli --configuration Release --no-build -- models download vosk-model-small-ru-0.22
          dotnet run --project tools/PitVoice.Cli --configuration Release --no-build -- models download vosk-model-small-en-us-0.15

      - name: Test
        env:
          PITVOICE_REQUIRE_MODELS: "1"
        run: dotnet test PitVoice.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Validate language packs
        run: dotnet run --project tools/PitVoice.Cli --configuration Release --no-build -- validate

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

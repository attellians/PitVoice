language: ru
name: Единица без форм
units:
  liters:
    synonyms: [литр]
  gallons:
    synonyms: [галлон]
    forms: { one: галлон }
intents:
  tires.all:
    patterns: ["меняй шины"]
    response: "меняем шины"
responses:
  not_understood: "не понял"
  not_connected: "no connection"
  not_in_car: "not in car"
  apply_failed: "failed"
  not_supported: "not supported"
tests:
  - say: "меняй шины"
    expect: [{ intent: tires.all }]

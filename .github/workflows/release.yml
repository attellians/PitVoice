name: Release

# A tag publishes PitVoice (release-publishing spec): vX.Y.Z is a stable release from a commit of main, vX.Y.Z-alpha a
# pre-release from a commit of development. X.Y.Z must match VERSION in the tagged commit, the tag must not be released
# yet, the usual build and tests must pass, then the installer, and nothing else, goes to GitHub Releases. Any failure
# leaves the releases as they were.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Must be the version of the Velopack package in src/PitVoice.App, or the installer will not match the app.
  VPK_VERSION: 1.2.161
  # Installer size limit (installation spec): the .NET runtime is inside, the models are not.
  MAX_SETUP_MB: 90
  # Alpha pre-releases kept after a new one is published; older ones go with their tags.
  KEEP_ALPHAS: 5

jobs:
  verify:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      version: ${{ steps.tag.outputs.version }}
      base: ${{ steps.tag.outputs.base }}
    steps:
      # The full history: the branch check needs origin/main and origin/development.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag form, VERSION and branch
        id: tag
        shell: bash
        run: bash .github/scripts/release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Version not released yet
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::version already released: $GITHUB_REF_NAME exists; the published release stays as it is"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  pack:
    needs: [verify, ci]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ needs.verify.outputs.kind }}
      # The full version, with the suffix for an alpha (0.0.27-alpha): "About", the log and the notices link show it.
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # App, CLI and the VR helper share one self-contained folder: they reuse the runtime and the native libraries; the
      # helper brings openvr_api.dll. The version from the tag overrides the one Directory.Build.props reads from VERSION;
      # for a stable release they are equal.
      - name: Publish
        run: |
          dotnet publish src/PitVoice.App/PitVoice.App.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=$env:VERSION
          dotnet publish tools/PitVoice.Cli/PitVoice.Cli.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=$env:VERSION
          dotnet publish src/PitVoice.VrOverlay/PitVoice.VrOverlay.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=$env:VERSION
          if (-not (Test-Path publish/PitVoice.VrOverlay.exe) -or -not (Test-Path publish/openvr_api.dll)) { throw "the VR helper or openvr_api.dll is missing in publish" }

      - name: Check third-party notices
        run: dotnet run --project tools/notices-gen -c Release -- --check

      - name: Add license files
        shell: bash
        run: cp LICENSE THIRD-PARTY-NOTICES.md publish/

      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VPK_VERSION

      # The message of the annotated tag is the text of the release; an empty message is fine.
      - name: Release notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      # The package id is the install directory, %LocalAppData%\PitVoiceApp. It must differ from the data directory
      # %LocalAppData%\PitVoice: the installer treats a non-empty directory as an installation and its "Repair" deletes
      # it whole, models included. The title is what the user sees: shortcuts and "Installed apps" say "PitVoice".
      # Releases/ holds no previous package, so no delta is built: updates from the app are not there yet.
      - name: Pack
        run: >
          vpk pack --packId PitVoiceApp --packVersion $env:VERSION --runtime win-x64 --packDir publish --mainExe PitVoice.exe
          --packTitle PitVoice --packAuthors "Artem Lebedko" --icon src/PitVoice.App/Assets/pitvoice.ico
          --releaseNotes release-notes.md --outputDir Releases

      # Users download PitVoice-win-Setup.exe, the only file of the release.
      - name: Name the installer
        shell: bash
        run: |
          if [ ! -f Releases/PitVoiceApp-win-Setup.exe ]; then
            echo "::error::the installer is not among the results of packing; nothing is published"
            ls -l Releases || true
            exit 1
          fi
          mv Releases/PitVoiceApp-win-Setup.exe Releases/PitVoice-win-Setup.exe

      - name: Installer size
        shell: bash
        run: |
          size=$(stat -c %s Releases/PitVoice-win-Setup.exe)
          mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
          echo "PitVoice-win-Setup.exe: $mb MB (limit $MAX_SETUP_MB MB)"
          if [ "$size" -gt $((MAX_SETUP_MB * 1048576)) ]; then
            echo "::error::installer is $mb MB, above the $MAX_SETUP_MB MB limit; nothing is published"
            exit 1
          fi

      # Only the installer: the update packages and their lists come back together with updates from the app.
      # An alpha is a pre-release and never the latest release, so releases/latest stays on the stable one.
      - name: Publish the release
        shell: bash
        run: |
          if [ "$KIND" = alpha ]; then latest=(--prerelease --latest=false); else latest=(--latest); fi
          gh release create "$GITHUB_REF_NAME" Releases/PitVoice-win-Setup.exe --repo "$GITHUB_REPOSITORY" \
            --title "PitVoice $VERSION" --notes-file release-notes.md --verify-tag "${latest[@]}"

      # A failed deletion only warns: the new pre-release is already published.
      - name: Remove old alphas
        if: env.KIND == 'alpha'
        shell: bash
        run: |
          if ! gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease,createdAt > releases.json \
            || ! old=$(bash .github/scripts/old-alphas.sh "$KEEP_ALPHAS" < releases.json); then
            echo "::warning::could not list the releases; old pre-releases stay until the next alpha"
            exit 0
          fi
          for tag in $old; do
            if gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
              echo "removed $tag"
            else
              echo "::warning::could not remove the old pre-release $tag; delete it and its tag by hand"
            fi
          done

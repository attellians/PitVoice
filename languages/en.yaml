# PitVoice language pack: English.
# Format: docs/adding-a-language.md. Validate with `pitvoice-cli validate`.
language: en
name: English
version: 1
asr_model: vosk-model-small-en-us-0.15
default_voice: piper-en-us-lessac-medium
plural_rules: en

units:
  liters:
    synonyms: [liters, liter, litres, litre, l]
    forms: { one: liter, other: liters }
  gallons:
    synonyms: [gallons, gallon, gal]
    forms: { one: gallon, other: gallons }

conjunctions: [and, and then, then, plus, also, as well as]
fillers: [please, just, hey, um, uh, okay, ok, now]
negations: [no, not, don't, dont, without, never]

intents:
  fuel.add:
    patterns:
      - "add {amount} {unit?}"
      - "fuel {amount} {unit?}"
      - "{amount} {unit} of fuel"
      - "put in {amount} {unit?}"
      - "add {amount} {unit?} of fuel"
      - "refuel {amount} {unit?}"
    response: "adding {amount} {unit}"

  fuel.none:
    patterns:
      - "no fuel"
      - "don't refuel"
      - "dont refuel"
      - "no refuel"
      - "skip fuel"
      - "without fuel"
    response: "no fuel"

  tires.all:
    patterns:
      - "change all tires"
      - "change tires"
      - "change the tires"
      - "all four"
      - "change all four tires"
      - "new tires"
      - "all tires"
    response: "changing all tires"

  tires.left:
    patterns:
      - "left side tires"
      - "left side"
      - "change left tires"
      - "left tires"
      - "change left side"
    response: "changing left side"

  tires.right:
    patterns:
      - "right side tires"
      - "right side"
      - "change right tires"
      - "right tires"
      - "change right side"
    response: "changing right side"

  tires.front:
    patterns:
      - "front tires"
      - "change front tires"
      - "change fronts"
      - "front side"
    response: "changing front tires"

  tires.rear:
    patterns:
      - "rear tires"
      - "change rear tires"
      - "change rears"
      - "rear side"
    response: "changing rear tires"

  tires.lf:
    patterns:
      - "front left tire"
      - "front left"
      - "change front left"
      - "left front tire"
      - "change left front"
    response: "changing front left"

  tires.rf:
    patterns:
      - "front right tire"
      - "front right"
      - "change front right"
      - "right front tire"
      - "change right front"
    response: "changing front right"

  tires.lr:
    patterns:
      - "rear left tire"
      - "rear left"
      - "change rear left"
      - "left rear tire"
      - "change left rear"
    response: "changing rear left"

  tires.rr:
    patterns:
      - "rear right tire"
      - "rear right"
      - "change rear right"
      - "right rear tire"
      - "change right rear"
    response: "changing rear right"

  tires.none:
    patterns:
      - "no tires"
      - "don't change tires"
      - "don't change all tires"
      - "dont change tires"
      - "no tire change"
      - "keep tires"
      - "no new tires"
    response: "no tire change"

  tires.none.left:
    patterns:
      - "no left side tires"
      - "no left tires"
      - "no left side"
      - "don't change left tires"
      - "dont change left tires"
      - "keep left tires"
    response: "keeping left side"

  tires.none.right:
    patterns:
      - "no right side tires"
      - "no right tires"
      - "no right side"
      - "don't change right tires"
      - "dont change right tires"
      - "keep right tires"
    response: "keeping right side"

  tires.none.front:
    patterns:
      - "no front tires"
      - "no fronts"
      - "don't change front tires"
      - "dont change front tires"
      - "keep front tires"
    response: "keeping front tires"

  tires.none.rear:
    patterns:
      - "no rear tires"
      - "no rears"
      - "don't change rear tires"
      - "dont change rear tires"
      - "keep rear tires"
    response: "keeping rear tires"

  tires.none.lf:
    patterns:
      - "no front left"
      - "no front left tire"
      - "no left front"
      - "don't change front left"
      - "dont change front left"
      - "keep front left"
    response: "keeping front left"

  tires.none.rf:
    patterns:
      - "no front right"
      - "no front right tire"
      - "no right front"
      - "don't change front right"
      - "dont change front right"
      - "keep front right"
    response: "keeping front right"

  tires.none.lr:
    patterns:
      - "no rear left"
      - "no rear left tire"
      - "no left rear"
      - "don't change rear left"
      - "dont change rear left"
      - "keep rear left"
    response: "keeping rear left"

  tires.none.rr:
    patterns:
      - "no rear right"
      - "no rear right tire"
      - "no right rear"
      - "don't change rear right"
      - "dont change rear right"
      - "keep rear right"
    response: "keeping rear right"

  windshield.tearoff:
    patterns:
      - "tear off"
      - "clean windshield"
      - "new tear off"
    response: "tear off"

  windshield.none:
    patterns:
      - "no tear off"
      - "keep windshield"
      - "don't tear off"
      - "dont tear off"
      - "no windshield"
    response: "no tear off"

  repair.fast:
    patterns:
      - "fast repair"
      - "quick repair"
      - "fix it"
      - "fix the car"
      - "use fast repair"
    response: "fast repair"

  repair.none:
    patterns:
      - "no fast repair"
      - "no repair"
      - "don't repair"
      - "dont repair"
      - "skip repair"
      - "no fix"
    response: "no repair"

  pit.clear:
    patterns:
      - "clear all"
      - "clear everything"
      - "clear pit"
      - "reset everything"
    response: "cleared everything"

  status.fuel:
    patterns:
      - "how much fuel"
      - "fuel level"
      - "fuel status"
      - "how much gas"
      - "fuel left"
      - "remaining fuel"
    response: "checking fuel"

  assistant.cancel:
    patterns:
      - "cancel"
      - "never mind"
      - "nevermind"
      - "stop"
      - "forget it"
      - "abort"
    response: "cancelled"

responses:
  not_understood: "sorry, say again"
  not_connected: "no connection to the game"
  not_in_car: "you are not in the car"
  apply_failed: "the command was not applied"
  not_supported: "not available yet"
  cancelled: "cancelled"

tests:
  # fuel.add
  - say: "add thirty liters"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "add thirty-five liters"
    expect: [{ intent: fuel.add, amount: 35, unit: liters }]
  - say: "add thirty five litres"
    expect: [{ intent: fuel.add, amount: 35, unit: liters }]
  - say: "add twenty"
    expect: [{ intent: fuel.add, amount: 20 }]          # unit comes from settings
  - say: "fuel a hundred liters"
    expect: [{ intent: fuel.add, amount: 100, unit: liters }]
  - say: "put in one hundred and five liters"
    expect: [{ intent: fuel.add, amount: 105, unit: liters }]
  - say: "twelve gallons of fuel"
    expect: [{ intent: fuel.add, amount: 12, unit: gallons }]
  - say: "Please add 40 liters now"
    expect: [{ intent: fuel.add, amount: 40, unit: liters }]
  - say: "add one liter"
    expect: [{ intent: fuel.add, amount: 1, unit: liters }]
  - say: "add a thousand liters"
    expect: reject

  # fuel.none
  - say: "no fuel"
    expect: [{ intent: fuel.none }]
  - say: "don't refuel"
    expect: [{ intent: fuel.none }]
  - say: "skip fuel"
    expect: [{ intent: fuel.none }]

  # tires.all
  - say: "change all tires"
    expect: [{ intent: tires.all }]
  - say: "change tires"
    expect: [{ intent: tires.all }]
  - say: "change all four tires"
    expect: [{ intent: tires.all }]
  - say: "new tires"
    expect: [{ intent: tires.all }]

  # tires.left / right / front / rear
  - say: "left side tires"
    expect: [{ intent: tires.left }]
  - say: "change left side"
    expect: [{ intent: tires.left }]
  - say: "right side tires"
    expect: [{ intent: tires.right }]
  - say: "change right tires"
    expect: [{ intent: tires.right }]
  - say: "front tires"
    expect: [{ intent: tires.front }]
  - say: "change fronts"
    expect: [{ intent: tires.front }]
  - say: "rear tires"
    expect: [{ intent: tires.rear }]
  - say: "change rears"
    expect: [{ intent: tires.rear }]

  # tires.none
  - say: "no tires"
    expect: [{ intent: tires.none }]
  - say: "don't change tires"
    expect: [{ intent: tires.none }]
  - say: "keep tires"
    expect: [{ intent: tires.none }]

  # single wheels
  - say: "front left tire"
    expect: [{ intent: tires.lf }]
  - say: "change right front"
    expect: [{ intent: tires.rf }]
  - say: "rear left"
    expect: [{ intent: tires.lr }]
  - say: "change rear right"
    expect: [{ intent: tires.rr }]
  - say: "change left front"
    expect: [{ intent: tires.lf }]
  - say: "front right tire"
    expect: [{ intent: tires.rf }]
  - say: "left rear tire"
    expect: [{ intent: tires.lr }]
  - say: "right rear tire"
    expect: [{ intent: tires.rr }]

  # removing sides and wheels
  - say: "no left side tires"
    expect: [{ intent: tires.none.left }]
  - say: "don't change right tires"
    expect: [{ intent: tires.none.right }]
  - say: "no front tires"
    expect: [{ intent: tires.none.front }]
  - say: "keep rear tires"
    expect: [{ intent: tires.none.rear }]
  - say: "no front left"
    expect: [{ intent: tires.none.lf }]
  - say: "keep front right"
    expect: [{ intent: tires.none.rf }]
  - say: "no rear left tire"
    expect: [{ intent: tires.none.lr }]
  - say: "don't change rear right"
    expect: [{ intent: tires.none.rr }]
  - say: "keep left tires"
    expect: [{ intent: tires.none.left }]
  - say: "no right side"
    expect: [{ intent: tires.none.right }]
  - say: "no fronts"
    expect: [{ intent: tires.none.front }]
  - say: "no rears"
    expect: [{ intent: tires.none.rear }]
  - say: "no left front"
    expect: [{ intent: tires.none.lf }]
  - say: "no front right tire"
    expect: [{ intent: tires.none.rf }]
  - say: "keep rear left"
    expect: [{ intent: tires.none.lr }]
  - say: "no right rear"
    expect: [{ intent: tires.none.rr }]

  # windshield
  - say: "tear off"
    expect: [{ intent: windshield.tearoff }]
  - say: "clean windshield"
    expect: [{ intent: windshield.tearoff }]
  - say: "no tear off"
    expect: [{ intent: windshield.none }]
  - say: "keep windshield"
    expect: [{ intent: windshield.none }]

  # repair
  - say: "fast repair"
    expect: [{ intent: repair.fast }]
  - say: "fix the car"
    expect: [{ intent: repair.fast }]
  - say: "no fast repair"
    expect: [{ intent: repair.none }]
  - say: "skip repair"
    expect: [{ intent: repair.none }]

  # pit.clear
  - say: "clear all"
    expect: [{ intent: pit.clear }]
  - say: "front"                                      # single words never change the pit stop
    expect: reject
  - say: "reset everything"
    expect: [{ intent: pit.clear }]
  - say: "clear all and add twenty"
    expect: reject

  # status.fuel
  - say: "how much fuel"
    expect: [{ intent: status.fuel }]
  - say: "fuel level"
    expect: [{ intent: status.fuel }]

  # assistant.cancel
  - say: "cancel"
    expect: [{ intent: assistant.cancel }]
  - say: "never mind"
    expect: [{ intent: assistant.cancel }]
  - say: "cancel and add twenty"
    expect: reject

  # compound commands
  - say: "change tires and add twenty five liters"
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "change all tires add twenty five liters"       # recognizer lost the conjunction
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "left side and add ten gallons"
    expect: [{ intent: tires.left }, { intent: fuel.add, amount: 10, unit: gallons }]
  - say: "add thirty liters as well as tear off"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }, { intent: windshield.tearoff }]
  - say: "change tires plus fast repair and then add fifty"
    expect: [{ intent: tires.all }, { intent: repair.fast }, { intent: fuel.add, amount: 50 }]
  - say: "change tires and change tires"
    expect: [{ intent: tires.all }]
  - say: "add twenty and add thirty"
    expect: [{ intent: fuel.add, amount: 30 }]
  - say: "change tires and sing a song"
    expect: reject

  # conflicts
  - say: "change tires and no tires"
    expect: reject
  - say: "add twenty and no fuel"
    expect: reject
  - say: "tear off and no tear off"
    expect: reject
  - say: "fast repair and no repair"
    expect: reject
  - say: "left side tires and no front left"
    expect: reject

  # tires: add and remove different wheels, overlapping additions
  - say: "right side tires and no left side tires"
    expect: [{ intent: tires.right }, { intent: tires.none.left }]
  - say: "left side tires and front tires"
    expect: [{ intent: tires.left }, { intent: tires.front }]

  # foreign phrases
  - say: "what is the weather today"
    expect: reject
  - say: "please okay"
    expect: reject
  - say: "change this side"
    expect: reject
  - say: "go faster"
    expect: reject

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PitVoice.sln

      - name: Build
        run: dotnet build PitVoice.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PitVoice.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Validate language packs
        run: dotnet run --project tools/PitVoice.Cli --configuration Release --no-build -- validate

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

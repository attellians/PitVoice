# PitVoice language pack: English.
# Format 2: words by class, the rules are the same for every language. See docs/adding-a-language.md.
# Validate with `pitvoice-cli validate`.
language: en
name: English
version: 2
asr_model: vosk-model-small-en-us-0.15
plural_rules: en

units:
  liters:
    synonyms: [liters, liter, litres, litre, l]
    forms: { one: liter, other: liters }
  gallons:
    synonyms: [gallons, gallon, gal]
    forms: { one: gallon, other: gallons }

conjunctions: [and, and then, then, plus, also, as well as]
fillers: [please, just, hey, um, uh, okay, ok, now, the]
# "keep" and "leave" mean "do not change": "keep tires", "leave the rears".
negations: [no, not, don't, without, never, skip, keep, leave]
# Words that reject the whole phrase: the driver asks for something PitVoice cannot do, e.g. intermediate tires.
reject_words: [intermediates, point, comma, who, ahead, behind]
# "to" and "two" sound the same: before a compound "two" is read as "to" ("change two slicks").
into_homophones: [two]

lexicon:
  fuel:
    action: [add, fuel, refuel, put in, fill, give me]
    object: [fuel]
  tires:
    action: [change, swap, replace, new]
    object: [tires, tire]
    targets:
      all: [all, all four]
      left: [left, left side]
      right: [right, right side]
      front: [front, fronts]
      rear: [rear, rears]
      lf: [front left, left front]
      rf: [front right, right front]
      lr: [rear left, left rear]
      rr: [rear right, right rear]
    # A compound changes all four tires; "to" leads to it: "change tires to wets".
    compounds:
      dry: [dry, slicks, slick]
      wet: [wet, wets, rain, rains]
    into: [to]
  windshield:
    action: [tear off, clean, wipe]
    object: [windshield]
  repair:
    action: [fix, repair]
    object: [car, repair]
    fast: [fast, quick]
  clear:
    action: [clear, reset]
    object: [all, everything, pit]

responses:
  fuel.add: "adding {amount} {unit}"
  fuel.none: "no fuel"
  tires.all: "changing all tires"
  tires.left: "changing left side"
  tires.right: "changing right side"
  tires.front: "changing front tires"
  tires.rear: "changing rear tires"
  tires.lf: "changing front left"
  tires.rf: "changing front right"
  tires.lr: "changing rear left"
  tires.rr: "changing rear right"
  tires.dry: "switching to dry tires"
  tires.wet: "switching to wet tires"
  tires.none: "no tire change"
  tires.none.left: "keeping left side"
  tires.none.right: "keeping right side"
  tires.none.front: "keeping front tires"
  tires.none.rear: "keeping rear tires"
  tires.none.lf: "keeping front left"
  tires.none.rf: "keeping front right"
  tires.none.lr: "keeping rear left"
  tires.none.rr: "keeping rear right"
  windshield.tearoff: "tear off"
  windshield.none: "no tear off"
  repair.fast: "fast repair"
  repair.none: "no repair"
  pit.clear: "cleared everything"
  not_understood: "sorry, say again"
  not_connected: "no connection to the game"
  not_in_car: "you are not in the car"
  apply_failed: "the command was not applied"
  no_dry_tires: "this car has no dry tires"
  no_wet_tires: "this car has no wet tires"
  several_dry_tires: "this car has several dry compounds"

tests:
  # fuel.add: every verb
  - say: "add thirty liters"
    expect: [{ intent: fuel.add, amount: 30, unit: liters }]
  - say: "add thirty-five liters"
    expect: [{ intent: fuel.add, amount: 35, unit: liters }]
  - say: "add thirty five litres"
    expect: [{ intent: fuel.add, amount: 35, unit: liters }]
  - say: "add twenty"
    expect: [{ intent: fuel.add, amount: 20 }]          # unit comes from settings
  - say: "fuel a hundred liters"
    expect: [{ intent: fuel.add, amount: 100, unit: liters }]
  - say: "refuel forty"
    expect: [{ intent: fuel.add, amount: 40 }]
  - say: "put in one hundred and five liters"
    expect: [{ intent: fuel.add, amount: 105, unit: liters }]
  - say: "fill twenty five liters"
    expect: [{ intent: fuel.add, amount: 25, unit: liters }]
  - say: "give me twenty liters"
    expect: [{ intent: fuel.add, amount: 20, unit: liters }]
  - say: "twelve gallons fuel"
    expect: [{ intent: fuel.add, amount: 12, unit: gallons }]
  - say: "Please add 40 liters now"
    expect: [{ intent: fuel.add, amount: 40, unit: liters }]
  - say: "add one liter"
    expect: [{ intent: fuel.add, amount: 1, unit: liters }]

  # fuel.none
  - say: "no fuel"
    expect: [{ intent: fuel.none }]
  - say: "don't refuel"
    expect: [{ intent: fuel.none }]
  - say: "skip fuel"
    expect: [{ intent: fuel.none }]

  # tires.all: every verb
  - say: "change all tires"
    expect: [{ intent: tires.all }]
  - say: "change tires"
    expect: [{ intent: tires.all }]
  - say: "tires change"
    expect: [{ intent: tires.all }]
  - say: "change all four tires"
    expect: [{ intent: tires.all }]
  - say: "swap tires"
    expect: [{ intent: tires.all }]
  - say: "replace all tires"
    expect: [{ intent: tires.all }]
  - say: "new tires"
    expect: [{ intent: tires.all }]

  # sides and axles
  - say: "left side tires"
    expect: [{ intent: tires.left }]
  - say: "change left side"
    expect: [{ intent: tires.left }]
  - say: "right side tires"
    expect: [{ intent: tires.right }]
  - say: "swap right tires"
    expect: [{ intent: tires.right }]
  - say: "front tires"
    expect: [{ intent: tires.front }]
  - say: "change fronts"
    expect: [{ intent: tires.front }]
  - say: "rear tires"
    expect: [{ intent: tires.rear }]
  - say: "replace rears"
    expect: [{ intent: tires.rear }]

  # single wheels: both orders of the name
  - say: "front left tire"
    expect: [{ intent: tires.lf }]
  - say: "left front"
    expect: [{ intent: tires.lf }]
  - say: "change right front"
    expect: [{ intent: tires.rf }]
  - say: "front right tire"
    expect: [{ intent: tires.rf }]
  - say: "rear left"
    expect: [{ intent: tires.lr }]
  - say: "left rear tire"
    expect: [{ intent: tires.lr }]
  - say: "change rear right"
    expect: [{ intent: tires.rr }]
  - say: "right rear tire"
    expect: [{ intent: tires.rr }]

  # several targets, action said once after a conjunction
  - say: "change front left and rear right"
    expect: [{ intent: tires.lf }, { intent: tires.rr }]
  - say: "change left side and fronts"
    expect: [{ intent: tires.left }, { intent: tires.front }]
  - say: "keep left side and rear right"
    expect: [{ intent: tires.none.left }, { intent: tires.none.rr }]
  - say: "add twenty and fronts"
    expect: reject
  - say: "right side don't"
    expect: reject                                       # a negation needs words after it: "don't change right side"

  # removal
  - say: "no tires"
    expect: [{ intent: tires.none }]
  - say: "don't change tires"
    expect: [{ intent: tires.none }]
  - say: "keep tires"
    expect: [{ intent: tires.none }]
  - say: "no left side tires"
    expect: [{ intent: tires.none.left }]
  - say: "no right side"
    expect: [{ intent: tires.none.right }]
  - say: "don't change right tires"
    expect: [{ intent: tires.none.right }]
  - say: "no front tires"
    expect: [{ intent: tires.none.front }]
  - say: "leave the rears"
    expect: [{ intent: tires.none.rear }]
  - say: "no front left"
    expect: [{ intent: tires.none.lf }]
  - say: "keep front right"
    expect: [{ intent: tires.none.rf }]
  - say: "no rear left tire"
    expect: [{ intent: tires.none.lr }]
  - say: "don't change rear right"
    expect: [{ intent: tires.none.rr }]
  - say: "keep fronts"
    expect: [{ intent: tires.none.front }]
  - say: "don't swap rears"
    expect: [{ intent: tires.none.rear }]
  - say: "keep left front"
    expect: [{ intent: tires.none.lf }]
  - say: "no right front tire"
    expect: [{ intent: tires.none.rf }]
  - say: "leave left rear"
    expect: [{ intent: tires.none.lr }]

  # windshield: every verb
  - say: "tear off"
    expect: [{ intent: windshield.tearoff }]
  - say: "clean windshield"
    expect: [{ intent: windshield.tearoff }]
  - say: "wipe windshield"
    expect: [{ intent: windshield.tearoff }]
  - say: "no tear off"
    expect: [{ intent: windshield.none }]
  - say: "keep windshield"
    expect: [{ intent: windshield.none }]

  # repair: every verb
  - say: "fast repair"
    expect: [{ intent: repair.fast }]
  - say: "quick repair"
    expect: [{ intent: repair.fast }]
  - say: "fix the car"
    expect: [{ intent: repair.fast }]
  - say: "repair car"
    expect: [{ intent: repair.fast }]
  - say: "no fast repair"
    expect: [{ intent: repair.none }]
  - say: "skip repair"
    expect: [{ intent: repair.none }]

  # pit.clear: every verb
  - say: "clear all"
    expect: [{ intent: pit.clear }]
  - say: "reset everything"
    expect: [{ intent: pit.clear }]
  - say: "clear pit"
    expect: [{ intent: pit.clear }]

  # compound commands, also with the conjunction lost
  - say: "change tires and add twenty five liters"
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "change tires add twenty five liters"
    expect: [{ intent: tires.all }, { intent: fuel.add, amount: 25, unit: liters }]
  - say: "add ten liters then tear off"
    expect: [{ intent: fuel.add, amount: 10, unit: liters }, { intent: windshield.tearoff }]
  - say: "change right tires and keep left side"
    expect: [{ intent: tires.right }, { intent: tires.none.left }]

  # conflicts
  - say: "change tires and no tires"
    expect: reject
  - say: "clear all and add twenty"
    expect: reject
  - say: "change tires and clear all"
    expect: reject

  # fractions, removed noise words, single words
  - say: "add thirty point two"
    expect: reject
  - say: "add a thousand liters"
    expect: reject
  - say: "add one thousand liters"
    expect: reject
  - say: "fix it"
    expect: reject
  - say: "how much gas"
    expect: reject
  - say: "cancel"
    expect: reject
  - say: "front"
    expect: reject
  - say: "reset"
    expect: reject
  - say: "fuel tires"
    expect: reject

  # unrelated speech
  - say: "what is the weather today"
    expect: reject
  - say: "who is ahead of me"
    expect: reject
  - say: "left front right"
    expect: reject
  - say: "change tires and sing a song"
    expect: reject

  # tire compounds: with an action, the object, "to" or "all"; all four tires
  - say: "change tires to wets"
    expect: [{ intent: tires.wet }]
  - say: "change to wet tires"
    expect: [{ intent: tires.wet }]
  - say: "rain tires"
    expect: [{ intent: tires.wet }]
  - say: "change all to rains"
    expect: [{ intent: tires.wet }]
  - say: "change to slicks"
    expect: [{ intent: tires.dry }]
  - say: "to dry"
    expect: [{ intent: tires.dry }]
  - say: "swap tires to slick"
    expect: [{ intent: tires.dry }]
  - say: "change to wets and add twenty liters"
    expect: [{ intent: tires.wet }, { intent: fuel.add, amount: 20, unit: liters }]
  - say: "wets"
    expect: reject                                       # one word never changes the pit stop
  - say: "change left to wets"
    expect: reject                                       # a compound only on all four tires
  - say: "no wet tires"
    expect: reject
  - say: "change to wets and to slicks"
    expect: reject
  - say: "change to intermediates"
    expect: reject                                       # a reject word
  # "to" without a compound: the recognizer lost a word it cannot write
  - say: "change tires to"
    expect: reject
  # "to" heard as "two": the recognizer cannot tell them apart
  - say: "change two slicks"
    expect: [{ intent: tires.dry }]
  - say: "change left two wets"
    expect: reject
  - say: "change twenty two slicks"
    expect: reject
  - say: "add two liters"
    expect: [{ intent: fuel.add, amount: 2, unit: liters }]
  - say: "add thirty point five liters"
    expect: reject
  - say: "who is ahead"
    expect: reject
  - say: "change tires change tires"
    expect: reject
